name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Pre-publish Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --ignore-scripts

    - name: Check JavaScript syntax
      run: |
        node --check bin/yida.js
        find lib -name "*.js" -not -path "*/node_modules/*" -not -path "*/babel-transform/*" | while read f; do node --check "$f"; done
        echo "All JS files passed syntax check"

    - name: Validate skills
      run: npm run check:skills

    - name: Run tests
      run: npm test

  publish:
    name: Publish to npm & Create Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --ignore-scripts

    - name: Sync version from tag to package manifests
      run: |
        TAG="${{ github.ref_name }}"
        # 去掉前缀 'v'，支持 v2026.04.01 和 2026.04.01 两种格式
        VERSION="${TAG#v}"
        CURRENT=$(node -p "require('./package.json').version")
        echo "Tag: $TAG → Version: $VERSION (current: $CURRENT)"
        if [ "$CURRENT" != "$VERSION" ]; then
          npm version "$VERSION" --no-git-tag-version
        else
          echo "Version already matches, skipping npm version"
        fi

    - name: Determine npm tag
      id: npm-tag
      run: |
        VERSION="${{ github.ref_name }}"
        if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
          echo "tag=beta" >> $GITHUB_OUTPUT
        else
          echo "tag=latest" >> $GITHUB_OUTPUT
        fi

    - name: Check npm version
      id: npm-version
      run: |
        TAG="${{ github.ref_name }}"
        VERSION="${TAG#v}"
        if npm view "openyida@$VERSION" version >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "openyida@$VERSION already exists on npm; skipping npm publish."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish to npm
      if: steps.npm-version.outputs.exists != 'true'
      run: npm publish --access public --tag ${{ steps.npm-tag.outputs.tag }}
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
        body: |
          ## 安装 / 更新

          Beta / RC 预发布：

          ```bash
          npm install -g openyida@beta
          ```

          正式版：

          ```bash
          npm install -g openyida
          ```

          安装后即可在 Codex / Claude Code / OpenCode / Cursor / QwenWork / Qoder / Qoder IDE / QoderWork 中直接使用，零配置。

        generate_release_notes: true
